# The one seam for Windows code signing. The build calls this for each .exe; the
# provider is chosen by the repository variable WINDOWS_SIGNING and changing
# provider touches only this file and its secrets.
#
#   WINDOWS_SIGNING unset or "off"   no signing (current state)
#   "azure"     Azure Artifact Signing. Needs an entity eligible for Public Trust
#               (see docs/signing.md); secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
#               AZURE_CLIENT_SECRET; variables AZURE_SIGNING_ENDPOINT,
#               AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE.
#   "signtool"  An OV certificate in a CA's cloud HSM exposed through its
#               signing tool or KSP; secrets per CA (see docs/signing.md).
#
# Every signed file is checked with signtool verify /pa before it is published.
name: sign-windows
description: Sign Windows executables with the configured provider and verify them
inputs:
  files:
    description: Space-separated paths of the .exe files to sign
    required: true
  provider:
    description: off, azure or signtool
    required: false
    default: "off"
runs:
  using: composite
  steps:
    - name: Signing is off
      if: inputs.provider == '' || inputs.provider == 'off'
      shell: bash
      run: echo "::notice::Windows signing is off (vars.WINDOWS_SIGNING); executables are unsigned."
    - name: Azure Artifact Signing
      if: inputs.provider == 'azure'
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ env.AZURE_SIGNING_PROFILE }}
        files: ${{ inputs.files }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
    - name: signtool with a cloud-HSM certificate
      if: inputs.provider == 'signtool'
      shell: pwsh
      run: |
        # The CA's KSP or signing client must be installed and logged in by an
        # earlier step using its own secrets; this step only invokes signtool.
        foreach ($f in "${{ inputs.files }}".Split(" ")) {
          & signtool sign /fd SHA256 /tr $env:SIGNING_TIMESTAMP_URL /td SHA256 /sha1 $env:SIGNING_CERT_SHA1 $f
          if ($LASTEXITCODE -ne 0) { throw "signing failed for $f" }
        }
    - name: Verify signatures
      if: inputs.provider == 'azure' || inputs.provider == 'signtool'
      shell: pwsh
      run: |
        foreach ($f in "${{ inputs.files }}".Split(" ")) {
          & signtool verify /pa /v $f
          if ($LASTEXITCODE -ne 0) { throw "signature does not verify: $f" }
        }
