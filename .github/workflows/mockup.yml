# Renders every state of the GUI mockup on Linux and Windows and uploads the
# PNGs. Linux runs under a virtual X server (the real xcb platform); Windows
# runs on the runner's own desktop session. If either cannot open a display,
# the offscreen platform renders instead, and the artifact name says which.
name: mockup screenshots

# Manual only.
on:
  workflow_dispatch:

permissions: {}

jobs:
  render:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt and X libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-dejavu-core fonts-noto-core
      - name: Install (hash-checked)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/build-backends.txt
          python -m pip install --require-hashes -r requirements/app.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Render (Linux, xcb under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" python -m routemap.gui.mockup --out shots-linux-xcb
      - name: Render (Windows, native platform)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m routemap.gui.mockup --out shots-windows-native \
            || QT_QPA_PLATFORM=offscreen python -m routemap.gui.mockup --out shots-windows-offscreen
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mockup-${{ runner.os }}
          path: shots-*/
