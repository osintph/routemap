# Desktop builds for every platform, smoke-tested, and a GitHub release on a tag.
#
# Unsigned for now. Signing (Windows via SignPath, Linux via a GPG-signed
# SHA256SUMS, macOS Developer ID behind a switch that is off) arrives as
# .github/actions/sign-<platform> composite actions in step 5 of the brief; the
# "sign" placeholders below mark where each one plugs in.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: windows-x86_64, os: windows-latest }
          # 22.04 for an older glibc, so the binary runs on more distributions.
          - { target: linux-x86_64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfuse2 file
      - name: Install
        run: python -m pip install -e ".[gui]" "pyinstaller==6.22.3" "jsonschema>=4.20"
      - name: Build
        run: pyinstaller packaging/routemap.spec --noconfirm --log-level WARN
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'from routemap.__about__ import __version__ as v; print(v)')" >> "$GITHUB_OUTPUT"

      # ---- smoke test the built binary, not the source -----------------------
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="dist/Route Map.app/Contents/MacOS/routemap"
          "$BIN" --version
          "$BIN" --smoke-test smoke
          "$BIN" parse tests/fixtures/routemap/heise_mtr.txt --offline --origin "Manila, PH" > smoke/parse.json
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/routemap.exe --version
          dist/routemap.exe --smoke-test smoke
          dist/routemap.exe parse tests/fixtures/routemap/heise_tracert.txt --offline --origin "Manila, PH" > smoke/parse.json
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/routemap --version
          QT_QPA_PLATFORM=offscreen dist/routemap --smoke-test smoke
          dist/routemap parse tests/fixtures/routemap/heise_traceroute.txt --offline --origin "Manila, PH" > smoke/parse.json

      # ---- package --------------------------------------------------------------
      - name: Package (macOS dmg, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc only, so it runs at all on Apple silicon. Not Developer ID signed
          # or notarised yet: see README for the Gatekeeper workaround.
          codesign --force --deep --sign - "dist/Route Map.app"
          codesign --verify --deep --strict "dist/Route Map.app"
          mkdir -p dmgroot out
          cp -R "dist/Route Map.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Route Map" -srcfolder dmgroot -ov -format UDZO \
            "out/routemap-${{ steps.v.outputs.version }}-${{ matrix.target }}.dmg"
      # sign-macos: Developer ID + notarytool, behind a repository variable (step 5)
      - name: Package (Windows exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp dist/routemap.exe "out/routemap-${{ steps.v.outputs.version }}-${{ matrix.target }}.exe"
      # sign-windows: SignPath Foundation request, then signtool verify (step 5)
      - name: Package (Linux AppImage and tar.gz)
        if: runner.os == 'Linux'
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p out AppDir/usr/bin
          cp dist/routemap AppDir/usr/bin/routemap
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/routemap.desktop AppDir/routemap.desktop
          cp routemap/gui/data/icon.png AppDir/routemap.png
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "out/routemap-$V-linux-x86_64.AppImage"
          mkdir -p "routemap-$V-linux-x86_64"
          cp dist/routemap LICENSE README.md packaging/linux/routemap.desktop routemap/gui/data/icon.png \
            "routemap-$V-linux-x86_64/"
          tar -czf "out/routemap-$V-linux-x86_64.tar.gz" "routemap-$V-linux-x86_64"
          ./out/routemap-$V-linux-x86_64.AppImage --appimage-extract-and-run --version
      - name: Sizes
        shell: bash
        run: ls -l out/
      - uses: actions/upload-artifact@v4
        with:
          name: routemap-${{ matrix.target }}
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: smoke/

  release:
    name: GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: routemap-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # sign-linux: GPG-sign SHA256SUMS (step 5)
      - name: Release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 - "$TAG" > notes.md <<'PY'
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(tag)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else f"Release {tag}.")
          PY
          cat packaging/release-notes-unsigned.md >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          # The title is the annotated tag's subject line ("vX: what it is").
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TITLE="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          TITLE="${TITLE:-$GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" assets/* --title "$TITLE" \
            --notes-file notes.md --verify-tag $PRE
