# Compiled desktop builds (Nuitka) for every platform, verified and smoke-tested;
# on a tag, published as a GitHub Release with a GPG-signed SHA256SUMS. One run,
# one commit: macOS DMGs, the Windows installer and zip, the Linux .deb, .rpm,
# AppImage and tar.gz. installers.yml wraps an earlier run's binaries the same way.
#
# Verification on every build:
#   - the built binary's own --smoke-test (opens the window, exports PNG/PDF/JSON)
#   - packaging/cli_check.sh: offline parse, and UTF-8 output when redirected
#   - the Windows installer installed, checked and uninstalled per user and per
#     machine (packaging/windows/install_check.ps1); the .deb and .rpm installed,
#     opened and removed in Ubuntu, Debian and Fedora (packaging/linux/install_check.sh)
#   - Windows: packaging/verify_windows.py (version resources, no packer
#     sections, routemap.exe windowed with no console and surviving its
#     launching console being killed) and a Microsoft Defender scan of every
#     Windows artifact (packaging/defender_scan.ps1), which fails the build on
#     any detection
#
# Signing: SHA256SUMS with the GPG release key; macOS ad-hoc only. The
# Windows build is not code-signed yet (a Certum certificate is being set up)
# and the run summary says so.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, os: macos-15 }
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: windows-x86_64, os: windows-2025 }
          # 22.04 for an older glibc, so the binary runs on more distributions.
          - { target: linux-x86_64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf ccache libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfuse2 file
      - name: Install
        run: python -m pip install ".[gui]" "nuitka==4.2.2" "jsonschema>=4.20"
      - name: Version and config folder
        id: v
        shell: bash
        run: |
          echo "version=$(python -c 'from routemap.__about__ import VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"
          echo "ROUTEMAP_CONFIG_DIR=$RUNNER_TEMP/routemap-config" >> "$GITHUB_ENV"

      # ---- macOS ------------------------------------------------------------------
      - name: Compile (macOS)
        if: runner.os == 'macOS'
        run: python packaging/build_nuitka.py macos
      - name: Verify and smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/nuitka/Route Map.app"
          cp THIRD_PARTY_NOTICES.md LICENSE "$APP/Contents/Resources/"
          BIN="$APP/Contents/MacOS/routemap-app"
          "$BIN" --version
          bash packaging/cli_check.sh "$BIN"
          "$BIN" --smoke-test smoke
          # One tag, one commit, every platform: the binary must report the commit being built.
          grep -q "commit $GITHUB_SHA " smoke/result.txt || { echo "::error::smoke/result.txt does not report commit $GITHUB_SHA"; cat smoke/result.txt; exit 1; }
          "$BIN" parse tests/fixtures/routemap/heise_mtr.txt --offline --origin "Manila, PH" > smoke/parse.json
      - name: Package (macOS dmg, ad-hoc signed)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          APP="build/nuitka/Route Map.app"
          # sign-macos: Developer ID + notarytool when vars.APPLE_SIGNING == 'true' (off).
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmgroot out
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          # hdiutil on hosted runners sometimes fails with "Resource busy" while
          # the system scans the new image; retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Route Map" -srcfolder dmgroot -ov -format UDZO \
              "out/routemap-$VERSION-${{ matrix.target }}.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt); retrying in 15 s"; sleep 15
          done

      # ---- Windows ----------------------------------------------------------------
      # Standalone folders, not one-file exes (a one-file exe is a compressed
      # self-extractor, which Defender's heuristics flagged in beta.3), merged
      # into one "Route Map" folder with the windowed app and the console CLI,
      # both with version resources and the application manifest. No packer.
      - name: Compile (Windows, windowed app and console CLI)
        if: runner.os == 'Windows'
        run: |
          python packaging/build_nuitka.py windows-gui
          python packaging/build_nuitka.py windows-cli
          python packaging/assemble_windows.py
      - name: Verify and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          D="build/nuitka/windows/Route Map"
          "$D/routemap-cli.exe" --version
          bash packaging/cli_check.sh "$D/routemap-cli.exe"
          "$D/routemap-cli.exe" --smoke-test smoke
          "$D/routemap-cli.exe" parse tests/fixtures/routemap/heise_tracert.txt --offline --origin "Manila, PH" > smoke/parse.json
          # The windowed exe has no stdout: its smoke test leaves result.txt.
          "$D/routemap.exe" --smoke-test smoke-gui
          for i in $(seq 1 60); do [ -f smoke-gui/result.txt ] && break; sleep 2; done
          cat smoke-gui/result.txt
          # One tag, one commit, every platform: the binary must report the commit being built.
          grep -q "commit $GITHUB_SHA " smoke/result.txt || { echo "::error::smoke/result.txt does not report commit $GITHUB_SHA"; cat smoke/result.txt; exit 1; }
          grep -q "commit $GITHUB_SHA " smoke-gui/result.txt || { echo "::error::smoke-gui/result.txt does not report commit $GITHUB_SHA"; cat smoke-gui/result.txt; exit 1; }
      - name: Resources, no packer, windowed, no console, survives its terminal (Windows)
        if: runner.os == 'Windows'
        run: python packaging/verify_windows.py "build/nuitka/windows/Route Map/routemap.exe" "build/nuitka/windows/Route Map/routemap-cli.exe"
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "build/nuitka/windows/Route Map" -DestinationPath "out/routemap-$env:VERSION-${{ matrix.target }}.zip"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/windows/build_installer.ps1 -Source "build/nuitka/windows/Route Map" -Commit $env:GITHUB_SHA -RunNumber $env:GITHUB_RUN_NUMBER -Out out
      - name: Install, check and uninstall, per user and per machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out -Filter "*-setup.exe").FullName
          pwsh packaging/windows/install_check.ps1 -Setup $setup -Commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Defender scan of every Windows artifact (fails on a detection)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          pwsh packaging/defender_scan.ps1 -Report smoke/defender.txt "build/nuitka/windows/Route Map" "out/routemap-$env:VERSION-${{ matrix.target }}.zip" (Get-ChildItem out -Filter "*-setup.exe").FullName
      # ---- Linux --------------------------------------------------------------------
      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: python packaging/build_nuitka.py linux
      - name: Verify and smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          build/nuitka/routemap --version
          QT_QPA_PLATFORM=offscreen bash packaging/cli_check.sh build/nuitka/routemap
          QT_QPA_PLATFORM=offscreen build/nuitka/routemap --smoke-test smoke
          # One tag, one commit, every platform: the binary must report the commit being built.
          grep -q "commit $GITHUB_SHA " smoke/result.txt || { echo "::error::smoke/result.txt does not report commit $GITHUB_SHA"; cat smoke/result.txt; exit 1; }
          build/nuitka/routemap parse tests/fixtures/routemap/heise_traceroute.txt --offline --origin "Manila, PH" > smoke/parse.json
      - name: Package (Linux AppImage and tar.gz)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          V="$VERSION"
          mkdir -p out AppDir/usr/bin
          cp build/nuitka/routemap AppDir/usr/bin/routemap
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/routemap.desktop AppDir/routemap.desktop
          cp routemap/gui/data/icon.png AppDir/routemap.png
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "out/routemap-$V-linux-x86_64.AppImage"
          mkdir -p "routemap-$V-linux-x86_64"
          cp build/nuitka/routemap LICENSE THIRD_PARTY_NOTICES.md packaging/linux/routemap.desktop \
            routemap/gui/data/icon.png "routemap-$V-linux-x86_64/"
          tar -czf "out/routemap-$V-linux-x86_64.tar.gz" "routemap-$V-linux-x86_64"
          ./out/routemap-$V-linux-x86_64.AppImage --appimage-extract-and-run --version
      - name: Package (Linux .deb and .rpm)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: sh packaging/linux/build_packages.sh build/nuitka/routemap "$VERSION" "$GITHUB_RUN_NUMBER" out

      - name: Sizes, and file names GitHub keeps as they are
        shell: bash
        run: |
          ls -l out/
          # GitHub changes other characters in release file names (it turned
          # "~" into "."), which breaks SHA256SUMS and every link to the file.
          bad=$(ls out | grep -vE '^[A-Za-z0-9._+-]+$' || true)
          [ -z "$bad" ] || { echo "::error::release file names GitHub would change: $bad"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routemap-${{ matrix.target }}
          path: out/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: |
            smoke/
            smoke-gui/

  linux-packages:
    # The .deb and .rpm on clean systems: dependencies resolve, the window
    # opens offscreen and on an X server, the menu entry validates, removal is clean.
    name: Install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "fedora:42", kind: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-linux-x86_64
          path: pkgs
      - name: Install, check and remove
        run: sh packaging/linux/install_check.sh "$(ls pkgs/*.${{ matrix.kind }})" "$GITHUB_SHA"

  release:
    name: Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.build.result == 'success' && needs.linux-packages.result == 'success'
    needs: [build, linux-packages]
    runs-on: ubuntu-24.04
    # The GPG release key lives in this environment.
    environment: downloads
    permissions:
      contents: write
    env:
      GPG_RELEASE_KEY: ${{ secrets.GPG_RELEASE_KEY }}
      GPG_RELEASE_PASSPHRASE: ${{ secrets.GPG_RELEASE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The engine is a published release
        run: |
          # No app release while the engine is pinned to a git commit.
          if grep -nE 'routemap-engine[^"]*@ *git\+' pyproject.toml; then
            echo "::error::pyproject.toml pins routemap-engine to a git commit; pin a PyPI release first."; exit 1
          fi
      - name: GPG key present
        run: |
          [ -n "$GPG_RELEASE_KEY" ] || { echo "::error::GPG_RELEASE_KEY is not set: nothing is published unsigned."; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: routemap-*
          path: release
          merge-multiple: true
      - name: Checksums, GPG signature, release notes
        run: |
          V="${GITHUB_REF_NAME}"
          cd release
          sha256sum * > SHA256SUMS
          echo "$GPG_RELEASE_KEY" | gpg --batch --import
          FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          echo "$GPG_RELEASE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$FPR" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          cd ..
          python3 packaging/release_notes.py "$V" --fingerprint "$FPR" > notes.md
          echo "FPR=$FPR" >> "$GITHUB_ENV"
          cat release/SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          # checkout fetches the tag as a bare ref to the commit; fetch the
          # annotated tag object itself, or the title falls back to the commit.
          git fetch --force origin "refs/tags/$V:refs/tags/$V"
          TITLE="$(git tag -l --format='%(contents:subject)' "$V")"
          [ -n "$TITLE" ] || { echo "::error::tag $V has no annotation subject"; exit 1; }
          PRE=""; case "$V" in *-*) PRE="--prerelease" ;; esac
          gh release create "$V" release/* --verify-tag $PRE --title "${TITLE:-$V}" --notes-file notes.md
      - name: Optional pre-release download site
        env:
          DOWNLOAD_HOST: ${{ secrets.DOWNLOAD_HOST }}
          DOWNLOAD_PORT: ${{ secrets.DOWNLOAD_PORT }}
          DOWNLOAD_USER: ${{ secrets.DOWNLOAD_USER }}
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          DOWNLOAD_KNOWN_HOSTS: ${{ secrets.DOWNLOAD_KNOWN_HOSTS }}
        run: |
          if [ -z "$DOWNLOAD_HOST" ] || [ -z "$DOWNLOAD_SSH_KEY" ]; then
            echo "Pre-release site not configured; skipped."; exit 0
          fi
          V="${GITHUB_REF_NAME}"
          cp notes.md release/RELEASE-NOTES.md
          python3 packaging/download_index.py version release "$V" release/RELEASE-NOTES.md > release/index.html
          install -m 700 -d ~/.ssh
          echo "$DOWNLOAD_SSH_KEY" > ~/.ssh/download_key && chmod 600 ~/.ssh/download_key
          echo "$DOWNLOAD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -p ${DOWNLOAD_PORT:-22} -i ~/.ssh/download_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The deploy key is restricted to rsync (rrsync) inside the download
          # root, so paths are relative to it and listings go through rsync too.
          rsync -av --chmod=D755,F644 -e "$SSH" release/ "$DOWNLOAD_USER@$DOWNLOAD_HOST:./$V/"
          rsync --list-only -e "$SSH" "$DOWNLOAD_USER@$DOWNLOAD_HOST:./" \
            | awk '$1 ~ /^d/ {print $NF}' | grep -v '^\.$' > versions.txt
          python3 packaging/download_index.py root versions.txt "$FPR" > index.html
          rsync -av --chmod=F644 -e "$SSH" index.html "$DOWNLOAD_USER@$DOWNLOAD_HOST:./index.html"

  site:
    name: Project site
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.release.result == 'success'
    needs: release
    uses: ./.github/workflows/site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  summary:
    # Always runs, and fails the run loudly: names any failed platform leg,
    # and on a tag treats a skipped or failed release-path job as a failure.
    # The Windows build being unsigned is reported in the summary, not hidden.
    name: Summary
    if: always()
    needs: [build, linux-packages, release, site]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Same structure on every platform
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each platform's packaged smoke test wrote parity.json: the rendered
          # window's panels, legends, chart series, table columns and look.
          # They must be identical (routemap/gui/parity.py).
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'smoke-*' --dir parity
          files=$(find parity -name parity.json | sort)
          echo "$files"
          first=$(echo "$files" | head -1)
          [ -n "$first" ] || { echo "::error::no parity.json from any platform"; exit 1; }
          fail=0
          for f in $files; do
            if ! diff -u "$first" "$f" > /dev/null; then
              echo "::error::$f differs from $first"; diff -u "$first" "$f" || true; fail=1
            fi
          done
          [ "$(echo "$files" | wc -l)" -ge 4 ] || { echo "::error::expected parity.json from 4 or more builds"; fail=1; }
          exit $fail
      - name: Per-job results
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          R_BUILD: ${{ needs.build.result }}
          R_RELEASE: ${{ needs.release.result }}
          R_SITE: ${{ needs.site.result }}
        run: |
          {
            echo "## Build ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name != "Summary") | "| \(.name) | \(.conclusion // .status) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          failed_legs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")')"
          if [ -n "$failed_legs" ]; then
            echo "::error::Failed: $failed_legs"; fail=1
          fi
          if [ "$IS_TAG" = "true" ]; then
            for pair in "release:$R_RELEASE" "site:$R_SITE"; do
              if [ "${pair#*:}" != "success" ]; then
                echo "::error::On a tag, the ${pair%%:*} job must succeed; it was ${pair#*:}."; fail=1
              fi
            done
          fi
          echo "Windows signing: not configured yet; the Windows build is unsigned." >> "$GITHUB_STEP_SUMMARY"
          exit $fail
