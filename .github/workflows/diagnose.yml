# Manual only: platform diagnostics for parity work (packaging/diagnose.py).
name: diagnose

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Trace target"
        default: "heise.de"

permissions: {}

jobs:
  diagnose:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          [ "$RUNNER_OS" = "Linux" ] && sudo apt-get install -y -q traceroute >/dev/null
          python -m pip install -q --require-hashes -r requirements/build-backends.txt
          python -m pip install -q --require-hashes -r requirements/app.txt
          python -m pip install -q --no-deps --no-build-isolation .
          [ "$RUNNER_OS" = "Linux" ] && { echo "--- man traceroute (probe methods)"; man traceroute | col -b | grep -E "^ +-(I|T|U|q|w|m) " -A3; sysctl net.ipv4.ping_group_range; id; } || true
      - name: Diagnose
        shell: bash
        # The input reaches the script as data, never as shell text (RM-18).
        env:
          TARGET: ${{ inputs.target }}
        run: python packaging/diagnose.py "$TARGET" | tee diag.json
      - name: Flow fields on the wire (Windows; pktmon needs the runner's administrator)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/diagnose_flow.py | tee flow.json
      - name: The D3 TCP flow check script runs (Windows; the runner drops ICMP, so it reports FAIL here)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/flowcheck_tcp.ps1 heise.de 443 4 | Tee-Object flowcheck.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-${{ matrix.os }}
          path: |
            diag.json
            flow.json
            flowcheck.txt
          if-no-files-found: ignore
