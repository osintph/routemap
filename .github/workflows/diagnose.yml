# Manual only: platform diagnostics for parity work (packaging/diagnose.py).
name: diagnose

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Trace target"
        default: "heise.de"

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          [ "$RUNNER_OS" = "Linux" ] && sudo apt-get install -y -q traceroute >/dev/null
          python -m pip install -q -e .
          [ "$RUNNER_OS" = "Linux" ] && { echo "--- man traceroute (probe methods)"; man traceroute | col -b | grep -E "^ +-(I|T|U|q|w|m) " -A3; sysctl net.ipv4.ping_group_range; id; } || true
      - name: Diagnose
        shell: bash
        run: python packaging/diagnose.py "${{ inputs.target }}" | tee diag.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-${{ matrix.os }}
          path: diag.json
