# Native installers from a finished build run, without recompiling: the
# installed app reports the commit that run built (Help > About, --version).
#
#   gh workflow run installers.yml -f build_run=<build.yml run id>
#
# Windows: an Inno Setup installer (per machine or per user, Start menu, an
# uninstaller listed in Settings > Apps, optional PATH), unsigned for now.
# Linux: .deb and .rpm with a menu entry. Each is installed, checked and
# removed on a clean system before it is uploaded: Windows in both modes,
# the packages in Ubuntu 24.04, Debian 12 and Fedora 42 containers.
name: installers
run-name: installers for build run ${{ inputs.build_run }}

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: "build.yml run id whose binaries are packaged"
        required: true
      sign_check:
        description: "Also run scripts/sign-windows.ps1 with a throwaway test certificate"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  source:
    name: Build run
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.run.outputs.sha }}
      number: ${{ steps.run.outputs.number }}
    steps:
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          case "$BUILD_RUN" in ''|*[!0-9]*) echo "::error::build_run must be a run id"; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" \
            --jq '.path, .conclusion, .head_sha, .run_number' > run.txt
          { read -r path; read -r conclusion; read -r sha; read -r number; } < run.txt
          [ "$path" = ".github/workflows/build.yml" ] || { echo "::error::run $BUILD_RUN is $path, not build.yml"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::run $BUILD_RUN concluded $conclusion"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Packaging build run $BUILD_RUN (#$number), commit $sha" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows installer
    needs: source
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      SHA: ${{ needs.source.outputs.sha }}
      RUN: ${{ needs.source.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-windows-x86_64
          path: dist
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Unpack the build
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "routemap-*-windows-x86_64.zip" | Select-Object -First 1
          $v = $zip.Name -replace '^routemap-(.*)-windows-x86_64\.zip$', '$1'
          Expand-Archive $zip.FullName -DestinationPath app
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: pwsh packaging/windows/build_installer.ps1 -Source "app\Route Map" -Version $env:VERSION -Commit $env:SHA -RunNumber $env:RUN -Out out -CommitInName
      - name: Checksum
        shell: bash
        run: cd out && sha256sum *-setup.exe | tee SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Uploaded before the install tests, so it is there even when one fails.
        with:
          name: routemap-windows-x86_64-setup
          path: out/*
      - name: Install, check and uninstall, per user and per machine
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out -Filter "*-setup.exe" | Select-Object -First 1).FullName
          pwsh packaging/windows/install_check.ps1 -Setup $setup -Commit $env:SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Defender scan of the installer (fails on a detection)
        shell: pwsh
        run: |
          pwsh packaging/defender_scan.ps1 -Report $env:RUNNER_TEMP/defender.txt (Get-ChildItem out -Filter "*-setup.exe").FullName

  linux:
    name: Linux packages
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SHA: ${{ needs.source.outputs.sha }}
      RUN: ${{ needs.source.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-linux-x86_64
          path: dist
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Build .deb and .rpm
        run: |
          tgz=$(ls dist/routemap-*-linux-x86_64.tar.gz)
          v=$(basename "$tgz" | sed -E 's/^routemap-(.*)-linux-x86_64\.tar\.gz$/\1/')
          tar -xzf "$tgz"
          sh packaging/linux/build_packages.sh "routemap-$v-linux-x86_64/routemap" "$v" "$RUN" out
          cd out && sha256sum *.deb *.rpm | tee SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routemap-linux-x86_64-packages
          path: out/*

  linux-install:
    name: Install on ${{ matrix.image }}
    needs: [source, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "fedora:42", kind: rpm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-linux-x86_64-packages
          path: pkgs
      - name: Install, check and remove
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: sh packaging/linux/install_check.sh "$(ls pkgs/*.${{ matrix.kind }})" "$SHA"

  sign-check:
    # scripts/sign-windows.ps1 end to end, with a self-signed certificate made
    # and trusted on this runner only, and Certum's real timestamp server.
    # Nothing it signs is uploaded.
    name: Signing script (test certificate)
    if: inputs.sign_check
    needs: [source, windows]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-windows-x86_64
          path: dist
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routemap-windows-x86_64-setup
          path: setup
      - name: Test certificate, trusted on this runner only
        shell: pwsh
        run: |
          $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Route Map test signing (not a release)" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256
          Export-Certificate -Cert $c -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          "THUMB=$($c.Thumbprint)" >> $env:GITHUB_ENV
      - name: Sign, rebuild, verify
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist -Filter "*-windows-x86_64.zip").FullName
          $setup = (Get-ChildItem setup -Filter "*-setup.exe").FullName
          pwsh scripts/sign-windows.ps1 -Zip $zip -Setup $setup -Thumbprint $env:THUMB -Out signed
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The signed installer installs, and its uninstaller is signed
        shell: pwsh
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          $setup = (Get-ChildItem signed -Filter "*-setup.exe").FullName
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Route Map"
          foreach ($f in "routemap.exe", "routemap-cli.exe", "unins000.exe") {
            $s = Get-AuthenticodeSignature (Join-Path $dir $f)
            if ($s.Status -ne "Valid") { throw "$f : $($s.Status)" }
            Write-Host "ok: installed $f is signed ($($s.SignerCertificate.Subject))"
          }
          pwsh packaging/windows/install_check.ps1 -Setup $setup -Commit $env:SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }

