# Re-signs a published release's SHA256SUMS after its files changed: renamed,
# or the Windows files replaced by the Certum-signed ones that
# scripts/sign-windows.ps1 makes.
#
#   gh workflow run resign-release.yml -f tag=v0.2.0-beta.3 -f build_run=<the tag's build run id>
#
# It signs nothing it cannot account for, and takes no hashes typed into the
# dispatch form (RM-04). Every file in the release must be, byte for byte, a
# file that the tag's own build run produced, or a Windows file that is that
# run's file signed by the pinned Certum certificate:
#   - the zip: the same files as the build's zip, each identical except
#     routemap.exe and routemap-cli.exe, which must be the build's bytes plus a
#     valid Authenticode signature from the certificate in
#     packaging/windows/signing-cert-sha1.txt (packaging/windows/signed_check.py);
#   - the installer, which sign-windows.ps1 rebuilds around the signed folder
#     (so its bytes cannot match the build's): a valid Authenticode signature
#     from that certificate.
# osslsigncode verifies each signature (digest, chain, timestamp). Any other
# file fails the run before anything is signed. The build run must be a
# successful build.yml run of the tag's commit, and its artifacts must still
# exist (GitHub keeps them 90 days).
name: resign-release
run-name: re-sign SHA256SUMS of ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0-beta.3"
        required: true
      build_run:
        description: "The build.yml run id that built that tag"
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resign:
    name: Check every file, then sign
    runs-on: ubuntu-24.04
    # The GPG release key lives in this environment.
    environment: downloads
    permissions:
      contents: write   # upload SHA256SUMS and its signature
      actions: read     # the build run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || { echo "::error::build_run must be a run id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osslsigncode (Ubuntu's signed package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode && osslsigncode --version | head -1
      - name: The build run built this tag
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.path, .conclusion, .head_sha' > run.txt
          { read -r path; read -r conclusion; read -r sha; } < run.txt
          [ "$path" = ".github/workflows/build.yml" ] || { echo "::error::run $BUILD_RUN is $path"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::run $BUILD_RUN concluded $conclusion"; exit 1; }
          [ "$sha" = "$commit" ] || { echo "::error::run $BUILD_RUN built $sha, $TAG is $commit"; exit 1; }
          echo "$TAG is $commit, built by run $BUILD_RUN"
      - name: What the build produced
        run: |
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'routemap-*' --dir built
          find built -type f -exec sha256sum {} + | awk '{print $1}' | sort -u > built.sha256
          echo "$(wc -l < built.sha256) files from the build run"
      - name: Every file in the release is accounted for
        run: |
          PIN="$(sed -n '1p' packaging/windows/signing-cert-sha1.txt | tr -d '[:space:]')"
          CA=/etc/ssl/certs/ca-certificates.crt
          verify() { osslsigncode verify -in "$1" -CAfile "$CA" -TSA-CAfile "$CA" > "$RUNNER_TEMP/verify.txt" 2>&1 \
                       || { cat "$RUNNER_TEMP/verify.txt"; echo "::error::$1: the Authenticode signature does not verify"; return 1; }; }
          mkdir rel && cd rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS SHA256SUMS.asc
          fail=0
          for f in *; do
            h=$(sha256sum "$f" | awk '{print $1}')
            built_file=$(find ../built -type f -name "$f" | head -1)
            if grep -qx "$h" ../built.sha256; then
              echo "ok  $f  (built by run $BUILD_RUN)"
            elif [[ "$f" =~ -windows-x86_64\.zip$ ]] && [ -n "$built_file" ]; then
              mkdir -p "$RUNNER_TEMP/z" && unzip -q -o "$f" -d "$RUNNER_TEMP/z"
              for exe in "$RUNNER_TEMP"/z/*/routemap.exe "$RUNNER_TEMP"/z/*/routemap-cli.exe; do verify "$exe" || fail=1; done
              python3 ../packaging/windows/signed_check.py zip "$built_file" "$f" --thumbprint "$PIN" || fail=1
            elif [[ "$f" =~ -windows-x86_64-setup\.exe$ ]]; then
              verify "$f" || fail=1
              python3 ../packaging/windows/signed_check.py signer "$f" --thumbprint "$PIN" || fail=1
            else
              echo "::error::$f ($h) is neither a file of run $BUILD_RUN nor its Windows file signed by the pinned certificate"; fail=1
            fi
          done
          [ "$(ls | wc -l)" -gt 0 ] || { echo "::error::the release has no files"; fail=1; }
          exit $fail
      - name: SHA256SUMS, signature, verify
        env:
          GPG_RELEASE_KEY: ${{ secrets.GPG_RELEASE_KEY }}
          GPG_RELEASE_PASSPHRASE: ${{ secrets.GPG_RELEASE_PASSPHRASE }}
        run: |
          [ -n "$GPG_RELEASE_KEY" ] || { echo "::error::GPG_RELEASE_KEY is not set"; exit 1; }
          cd rel
          sha256sum -- * > SHA256SUMS
          echo "$GPG_RELEASE_KEY" | gpg --batch --import
          FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          echo "$GPG_RELEASE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$FPR" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        run: gh release upload "$TAG" rel/SHA256SUMS rel/SHA256SUMS.asc --clobber --repo "$GITHUB_REPOSITORY"
