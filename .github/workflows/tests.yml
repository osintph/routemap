# App tests: settings, exports, CLI and the offscreen window, on each OS. Kept
# lean. The engine's own tests, including the parser fixtures, run in the
# osintph/routemap-engine repository.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-2025, python: "3.12" }
          - { os: macos-15, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (hash-checked)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/build-backends.txt
          python -m pip install --require-hashes -r requirements/app.txt
          python -m pip install --require-hashes -r requirements/tests.txt
          python -m pip install --no-deps --no-build-isolation .
      # The consent banner's browser tests run in the job below, where a skip fails.
      - run: python -m pytest --ignore=tests/test_site_consent.py

  consent:
    # The site's consent banner in a real browser: no Google request before
    # consent or after a refusal, events after consent. Playwright from a
    # hash lock, its own Chromium; a skipped test fails the job.
    name: consent banner (headless Chromium)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements/build-backends.txt
          python -m pip install --require-hashes -r requirements/app.txt
          python -m pip install --require-hashes -r requirements/tests.txt
          python -m pip install --require-hashes -r requirements/consent-tests.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Playwright's Chromium
        run: python -m playwright install --with-deps chromium
      - name: Consent tests (a skip fails the job)
        env:
          ROUTEMAP_REQUIRE_CONSENT_TESTS: "1"
          ROUTEMAP_CONSENT_BROWSER: chromium
        run: |
          python -m pytest tests/test_site_consent.py -rs --junitxml=consent.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("consent.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"consent tests: {tests}, skipped: {skipped}")
          assert tests >= 9 and skipped == 0, "every consent test must run"
          EOF

  update-signing:
    # The release's update signing, end to end, with a key made for this job
    # and thrown away: no secret, no environment, nothing uploaded. The real
    # key is exercised only by sign-dry-run.yml, from main, on approval.
    name: update signing (throwaway key)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign and verify a test release with a throwaway key
        run: |
          openssl version
          work="$(mktemp -d "$RUNNER_TEMP/dry.XXXXXX")"
          mkdir "$work/release"
          printf 'test build\n' > "$work/release/routemap-0.0.0-linux-x86_64.AppImage"
          (cd "$work/release" && sha256sum -- * > SHA256SUMS)
          (umask 077; openssl genpkey -algorithm ed25519 -out "$work/key.pem")
          pub="$(openssl pkey -in "$work/key.pem" -pubout -outform DER | tail -c 32 | base64)"
          UPDATE_ED25519_KEY="$(cat "$work/key.pem")" bash packaging/sign_update.sh v0.0.0-dry.1 "$work/release"
          UPDATE_PUBLIC_KEYS_B64="$pub" bash packaging/verify_update_signature.sh v0.0.0-dry.1 "$work/release"
          # Expected refusals, silenced so their ::error:: lines do not annotate a
          # passing run. The same signature must fail against the embedded key.
          if bash packaging/verify_update_signature.sh v0.0.0-dry.1 "$work/release" > /dev/null 2>&1; then
            echo "::error::a throwaway signature passed against the embedded key"; exit 1
          fi
          # And against another tag.
          if UPDATE_PUBLIC_KEYS_B64="$pub" bash packaging/verify_update_signature.sh v0.0.0-dry.2 "$work/release" > /dev/null 2>&1; then
            echo "::error::the signature passed for another tag"; exit 1
          fi
          rm -rf "$work"
