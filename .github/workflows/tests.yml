# Unit tests, parser fixtures and the offscreen GUI smoke test on every
# platform the app ships for. Build, sign and release workflows arrive later.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev,gui]"
      - name: Tests
        run: python -m pytest

  # One real traceroute per platform, with the system's own tool, to a stable
  # public target. Cloud runners filter a lot of ICMP, so this asserts that the
  # tool ran, its output streamed and the parser read it, not how far it got.
  real-trace:
    name: real trace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ROUTEMAP_REAL_TRACE: "1"
      ROUTEMAP_REAL_TARGET: "1.1.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: traceroute (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq traceroute
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Real trace
        run: python -m pytest tests/test_runner.py -k real -s
