# Weekly update proposals for every hash lock and every pinned action
# (hardening 5). Each arrives as a pull request with the new versions and
# hashes, runs the tests, and needs the CLA check like any other; nothing is
# merged without review. The locks are compiled by requirements/compile.sh
# (and requirements/app.txt with its own command); recompile the others after
# merging an update to app.txt so their constraints follow.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
