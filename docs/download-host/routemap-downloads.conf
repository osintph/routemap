# nginx vhost for the optional Route Map pre-release download site.
#
# Static files only, behind per-tester HTTP basic auth (scripts/testers.sh
# manages the htpasswd file). One folder per version, published by the build
# workflow over rsync; index.html files are generated by the workflow, so
# autoindex stays off. Replace downloads.example.org and the certificate paths.
#
# Public releases are on GitHub Releases; this site is only for builds handed
# to a few testers before release.

# Downloads are saved, not opened. A map rather than add_header in a nested
# location: any add_header in a location drops every server-level add_header,
# which is how a response loses its Cache-Control or X-Robots-Tag.
map $uri $routemap_disposition {
    ~*\.(dmg|exe|zip|AppImage|tar\.gz)$  attachment;
    default                              "";
}

server {
    listen 80;
    listen [::]:80;
    server_name downloads.example.org;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name downloads.example.org;

    ssl_certificate     /etc/letsencrypt/live/downloads.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/routemap-downloads;
    index index.html;
    autoindex off;
    charset utf-8;

    # Behind Cloudflare (or any proxy), recover the visitor's address so logs
    # and fail2ban see the visitor, not the proxy. Trust only the proxy's
    # published ranges (https://www.cloudflare.com/ips/), for example:
    #   set_real_ip_from 173.245.48.0/20;   (one line per range)
    #   real_ip_header X-Forwarded-For;     (or CF-Connecting-IP)
    #   real_ip_recursive on;

    access_log /var/log/routemap-downloads/access.log;
    # fail2ban's nginx-http-auth filter reads failed logins from here.
    error_log /var/log/routemap-downloads/error.log error;

    # Addresses fail2ban has banned (deny lines; see fail2ban-*.conf).
    include /etc/nginx/routemap-banned/*.conf;

    auth_basic "Route Map pre-release";
    auth_basic_user_file /etc/nginx/routemap-testers.htpasswd;

    # On every response, including 401, 403 and 404 ("always"): never stored
    # by a CDN or shared cache (a CDN that caches a file once served it to
    # anyone after that, login or not), and never indexed.
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Content-Disposition $routemap_disposition always;
    # No other site may open this one in a shared browsing context or embed its
    # files (hardening 11).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Crawlers cannot log in, so this one file is public.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Nothing hidden is ever served (.htpasswd copies, editor files, .git).
    # First of the regex locations: nginx tries them in file order, so a hidden
    # file ending in .md or .asc would otherwise match the rule below.
    location ~ /\. {
        deny all;
    }

    location ~ (SHA256SUMS|\.asc|\.md)$ {
        default_type text/plain;
        try_files $uri =404;
    }
}
