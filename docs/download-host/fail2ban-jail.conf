# /etc/fail2ban/jail.d/routemap-downloads.conf
# Failed logins on the pre-release download site: 5 wrong passwords or unknown
# users from one address within 10 minutes ban it from the site for 1 hour.
#
# The ban is a "deny" line in nginx, not a firewall rule: behind a CDN the
# firewall only sees the CDN's addresses, and blocking those would lock out
# every tester. nginx recovers the visitor's address (real_ip) and denies it.
[routemap-downloads]
enabled  = true
filter   = nginx-http-auth
logpath  = /var/log/routemap-downloads/error.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h
action   = routemap-nginx-deny
