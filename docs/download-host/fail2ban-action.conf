# /etc/fail2ban/action.d/routemap-nginx-deny.conf
# Bans as "deny <ip>;" lines in a file the download vhost includes, then a
# graceful nginx reload. Set <reload> to how your nginx is reloaded, for
# example "docker exec <container> nginx -s reload" for nginx in Docker.
[Definition]
actionstart = touch <denyfile>
actionstop  = : > <denyfile>
              <reload>
actioncheck =
actionban   = grep -qxF 'deny <ip>;' <denyfile> || echo 'deny <ip>;' >> <denyfile>
              <reload>
actionunban = sed -i '/^deny <ip>;$/d' <denyfile>
              <reload>

[Init]
denyfile = /etc/nginx/routemap-banned/fail2ban.conf
reload   = nginx -s reload
