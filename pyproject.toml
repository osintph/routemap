[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# The product name lives in routemap/__about__.py. This literal is one of the
# build-time copies listed in docs/renaming.md.
name = "routemap"
dynamic = ["version"]
description = "Hostname-first, physics-checked traceroute maps. Runs the trace on your own machine."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "osintph", email = "sb@osintph.info" }]
keywords = ["traceroute", "geolocation", "osint", "network", "map"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# The engine is its own public package (AGPL-3.0), from PyPI.
dependencies = [
    "routemap-engine==0.2.2",
]

[project.optional-dependencies]
# The desktop app. Pinned exactly: the window is tested and screenshotted
# against this Qt, and PyInstaller bundles whatever is installed.
gui = ["PySide6==6.11.2"]
dev = [
    "pytest>=8",
    "jsonschema>=4.20",
    # QR codes for the project site's donation page (site/build.py).
    "segno==1.6.6",
]

[project.urls]
Homepage = "https://github.com/osintph/routemap"
Issues = "https://github.com/osintph/routemap/issues"
Changelog = "https://github.com/osintph/routemap/blob/main/CHANGELOG.md"

[project.scripts]
routemap = "routemap.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "routemap/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["routemap", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "PRIVACY.md", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["routemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
