<h1>Screenshots</h1>
<p class="lead">A live trace from Manila to heise.de with Route Map 0.2.0-beta.3's built-in
prober, origin set in Settings; the first six hops (the home network and the ISP) carry documentation
addresses. The images follow this site's light or dark mode, as the app follows the system.</p>
<figure class="shot">
  [[pic window jpg 1600 1000 bare|Route Map 0.2.0-beta.3 on macOS with a live trace from Manila to heise.de: the map, the route summary, the hop table and the details of hop 7]]
  <figcaption><strong>macOS.</strong> Fifteen hops: the home network and the ISP, then Stockholm and Frankfurt on Arelion's backbone (AS1299), then Plus.line in Germany (AS12306). Lines warm with the RTT each step added; the summary has the AS path with RPKI, the countries, a RIPE Atlas baseline and the RIS view.</figcaption>
</figure>
<figure class="shot">

</figure>

  <figcaption><strong>Trace again and compare.</strong> A run on 5 October against the run of 3 October: the route now leaves through Stockholm instead of Hong Kong, Singapore, Marseille and Paris.</figcaption>
</figure>
