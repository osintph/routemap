<h1>Screenshots</h1>
<p class="lead">A recorded trace from Manila to heise.de, origin set in Settings, drawn by
the app on the macOS desktop; the first five hops (the home network and the ISP) carry documentation
addresses. The images follow this site's light or dark mode, as the app follows the system.</p>

  <figcaption><strong>macOS.</strong> Sixteen hops: the local network, then Hong Kong, Singapore, Marseille, Paris and Frankfurt on Arelion's backbone (AS1299), then Plus.line in Frankfurt (AS12306). Lines warm with the RTT each step added; the summary has the AS path with RPKI, the countries, a RIPE Atlas baseline and the RIS view.</figcaption>
</figure>

</figure>

</figure>
