# The project site's branding, links, contact and donations, in one place. A
# rename or a domain change is a change here (and in routemap/__about__.py for
# the app itself).

[site]
product = "Route Map"
hostname = "getroutemap.app"
url = "https://getroutemap.app"
contact = "support@getroutemap.app"
tagline = "traceroute on a world map, placed by hostname, checked by physics"
statement = "Route Map draws a traceroute on a world map, placing each router by its own hostname and checking every placement against the round-trip time."
description = "See a traceroute on a world map. Route Map places each router by its hostname and checks it against the round-trip time. Free and open source for Windows, macOS and Linux."

[links]
repository = "https://github.com/osintph/routemap"
releases = "https://github.com/osintph/routemap/releases"
issues = "https://github.com/osintph/routemap/issues"
engine = "https://github.com/osintph/routemap-engine"
falconeye = "https://falconeye.osintph.info"
builder = "https://osintph.info"
builder_name = "OSINTPH"

[donate]
# In this order everywhere.
kofi = "https://ko-fi.com/osintph"
paypal = "https://paypal.me/osintph"
bitcoin = "bc1q8hn6knzpkp0f2s06qncljpcsatv9dlqan5ttjv"
monero = "42kA1yiEM8GSan4FeeZ9MxGtZCLNwYsvGefWLrMJ849dV2o9eVrc1Pufc7LcBAbRebXbVdxC5eoKj1a8pXJ3fSuFUDKLtXM"
pays_for = "code signing, hosting, the RIPE Atlas probe, and maintenance time"

[release]
gpg_fingerprint = "D57C7E26C19F9436E2D66F37408097D191DDF981"

[signing]
# true once the Windows builds are code-signed (the maintainer's Certum
# certificate): the download page then drops the unsigned warning.
windows_signed = false

[analytics]
# Google Analytics 4 measurement ID ("G-" and letters/digits). Empty: no
# Analytics, no consent banner, no cookie settings link. When set, Analytics
# loads only after the visitor accepts it in the banner (assets/consent.js).
ga_measurement_id = ""
